<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Perfil</title>

    <link rel="stylesheet" href="css/profile.css">

        <!-- Icones -->

        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"

        crossorigin="anonymous" 
        referrerpolicy="no-referrer" />
</head>
<body> 
    <div class="sidebar">
        <i class="fa-solid fa-building-columns"></i>    

        <header>Instituição X</header>
        <ul>
            <li>
                <a href="#"><i class="fas fa-solid fa-house"></i></i>Início</i></a>
            </li>
            <li>
                <a href="#"><i class="fa-solid fa-circle-user"></i></i>Perfil</i></a>
            </li>
            <li><a href="#"><i class="fa-solid fa-circle-check"></i>Avaliações</a></li>
            <li>
                <a href="#"><i class="fas fa-solid fa-file-lines"></i></i>Relatórios</i></a>
            </li>
            <li>
                <a href="#"><i class="fas fa-solid fa-folder-open"></i></i>Documentos</i></a>
            </li>
            <li>
                <a href="#"><i class="fas fa-solid fa-address-card"></i></i>Contato</i></a>
            </li>
            <li><a href="#"><i class="fa-solid fa-image"></i>Galeria</a></li>
            <li>
                <a href="#"><i class="fas fa-solid fa-rotate-left"></i></i>Voltar</i></a>
            </li>
        </ul>
   </div>
    <!-- Nav bar -->
    <div class="navbar-container">
        <nav>
            <ul class="navbar-items">
                <li>
                    <a href="#">Sobre Nós</a>
                </li>
                <li>
                    <a href="#">O que é CPA?</a>
                </li>
                <li>
                    <a href="#">Instituições</a>
                </li>
                <li>
                    <a href="#"> Cadastre-se</a>
                </li>
                <li>
                    <a href="#" class="login-btn">Entrar</a>
                </li>
            </ul>
        </nav>
    </div>
    <!-- Instituição -->

    <main>
        <section class="main-section">

            <div class="container-profile">

                <div class="container">

                    <div class="title-profile">
                        <span id="questionario-nome"><i class="fa-solid fa-pen-to-square"></i>EDITAR DADOS DE USUÁRIO</span>
                    </div>  

                    <div class="info-user">
                        <ul>
                            <li>
                                <span class="">Nome:</span>
                                <input type="text" name="nameText" id="name">
                            </li>
                            <li>
                                <span class="">Telefone:</span>
                                <input type="number" name="phonenumberText" id="phonenumber">
                            </li>
                            <li>
                                <span class="">Email:</span>
                                <input type="text" name="emailText" id="email">
                            </li>
                            <li>
                                <span class="">Função:</span>
                                <input type="text" name="functionText" id="function">
                            </li>
                            <li>
                                <span class="">Instituição:</span>
                                <input type="text" name="institutionText" id="institution">
                            </li>
                        </ul>   
                    </div> 
                    
                    <button type="submit" class="submit-btn-save">Salvar</button>

                </div>
            </div>
        </section>
    </main>

    <!-- Footer -->
    <footer>
        <img src="images/icone1.jpeg" alt="Icone CPA" class="logo">
        <p>SIS CPA - 2024</p>
    </footer>
