<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastre-se</title>

    <link rel="stylesheet" href="css/register.css">

    <!-- Icones -->
    <link rel="stylesheet" 
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" 
    integrity="sha512-SnH5WK+bZxgPHs44uWIX+LLJAJ9/2PkPKZ5QiAj6Ta86w+fsb2TkcmfRyVX3pBnMFcV7oQPJkl9QevSCWr3W6A==" 
    crossorigin="anonymous" 
    referrerpolicy="no-referrer" />

</head>
<body>
    <!-- Navbar -->
        <div class="navbar-container">
            <nav>
                <a href="#">
                    <img src="images/icone1.jpeg" alt="Icone CPA" class="logo">
                </a>
                <ul class="navbar-items">
                    <li>
                        <a href="#">Sobre Nós</a>
                    </li>
                    <li>
                        <a href="#">O que é CPA?</a>
                    </li>
                    <li>
                        <a href="#">Instituições</a>
                    </li>
                    <li>
                        <a href="#"> Cadastre-se</a>
                    </li>
                    <li>
                        <a href="#" class="login-btn">Entrar</a>
                    </li>
                </ul>
            </nav>
        </div>
    </div>

    <!-- Main -->
    <main>
        <div  class="main-title">
            <i class="fas fa-user"></i> 
        </div>
        
        <section class="register-container">    
            <div class="register1">
                <form action="cadastrar_usuario" method="POST" id="registrationForm">
                    <input type="text" name="name" placeholder="Nome Completo" class="name" required>
                    <input type="text" name="email" placeholder="Email" class="email" required>

                    <div class="password">
                        <input type="password" name="password" placeholder="Senha" class="password-camp" required>
                        <input type="password" name="confirm-password" placeholder="Confirmar Senha" class="password-camp" required>
                    </div>

                    <div class="link-institution">
                        <select id="contract-situation" name="contract-situation" class="custom-select" required>
                            <option value="default">Selecione uma instituição para se vincular</option>
                            <!-- Outras opções podem ser adicionadas aqui -->
                        </select>
                    </div>

                    <div class="type-user">
                        <select id="contract-situation" name="contract-situation" class="custom-select" required>
                            <option value="default">Selecione seu papel na instituição</option>
                            <!-- Outras opções podem ser adicionadas aqui -->
                        </select>
                            
                    </div>
                        
                    <button type="submit" class="btn-register">Cadastrar</button>
                </form>
            </div>
        
            <div class="container-image">
                <img src="images/sala1.png" alt="sala1" class="sala1">
            </div>
        </section>
    </main>  


    <!-- Footer -->
    <footer>
        <img src="images/icone1.jpeg" alt="Icone CPA" class="logo">
        <p>SIS CPA - 2024</p>
    </footer>
</body>
</html>
