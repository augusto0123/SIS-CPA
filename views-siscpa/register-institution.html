<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registrar Instituição</title>

    <link rel="stylesheet" href="css/register-institution.css">

</head>
<body>
    <!-- Navbar -->
        <div class="navbar-container">
            <nav>
                <a href="#">
                    <img src="images/icone1.jpeg" alt="Icone CPA" class="logo">
                </a>
                <ul class="navbar-items">
                    <li>
                        <a href="#">Sobre Nós</a>
                    </li>
                    <li>
                        <a href="#">O que é CPA?</a>
                    </li>
                    <li>
                        <a href="#">Instituições</a>
                    </li>
                    <li>
                        <a href="#"> Cadastre-se</a>
                    </li>
                    <li>
                        <a href="#" class="login-btn">Entrar</a>
                    </li>
                </ul>
            </nav>
        </div>
    </div>

    <!-- Main -->
    <main>
        <div  class="main-title">
            <h1>Cadastrar Instituição</h1>
        </div>
        <!-- Seção da instituição -->
        <section class="register-institution-container">
            <div id="register2">
                <h2 class="second-title">Instituição</h2>
                <input type="text" name="fantasy-name" placeholder="Nome Fantasia" class="fantasy-name">
                <br>
                <input type="text" name="corporate-reason" placeholder="Razão Social" class="corporate-reason">
                <div class="email">
                    <input type="text" name="email" placeholder="Email" class="email">
                </div>
                <div class="cnpj-tel">
                    <input type="text" name="cnpj" placeholder="CNPJ" class="cnpj-tel">
                    <input type="text" name="telephone" placeholder="Telefone" class="cnpj-tel">
                </div>
                <div class="password">
                    <input type="password" name="password" placeholder="Senha" class="password">
                    <input type="password" name="confirm-password" placeholder="Confirmar Senha" class="password">
                </div>
            </div>
            <img src="images/sala2.png" alt="Sala de aula" class="sala2">
        </section>

        
        <!-- Seção de endereço -->
        <section class="register-address-container">
            <div id="register1">
                <h2 class="second-title">Endereço</h2>
                <input type="text" name="street" placeholder="Logradouro" class="street">
                <div class="number-neighborhood">
                    <input type="text" name="number" placeholder="Número" class="number-neighborhood">
                    <input type="text" name="neighborhood" placeholder="Bairro" class="number-neighborhood">
                </div>
                <div class="city-state">
                    <input type="text" name="city" placeholder="Cidade" class="city-state">
                    <input type="text" name="state" placeholder="Estado" class="city-state">
                </div>
                <div class="cep-reference">
                    <input type="text" name="cep" placeholder="CEP" class="cep-reference">
                    <input type="text" name="reference" placeholder="Referência (Opcional)" class="cep-reference">
                </div>
                <a href="#" class="btn-register">Cadastrar</a>
            </div>
            
            <img src="images/faculdade.png" alt="sala1" class="university">
        </section>

        

    </main>


    <!-- Footer -->
    <footer>
        <img src="images/icone1.jpeg" alt="Icone CPA" class="logo">
        <p>SIS CPA - 2024</p>
    </footer>
</body>
</html>
