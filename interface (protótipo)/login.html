<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>

    <!-- Estilos -->
    <link rel="stylesheet" href="css/login.css">

</head>
<body>
    <div class="container">
        <!-- Navbar -->
        <div class="navbar-container">
            <nav>
                <a href="#">
                    <img src="images/icone1.jpeg" alt="Icone CPA" class="logo">
                </a>
                <ul class="navbar-items">
                    <li>
                        <a href="#">Sobre Nós</a>
                    </li>
                    <li>
                        <a href="#">O que é CPA?</a>
                    </li>
                    <li>
                        <a href="#">Instituições</a>
                    </li>
                    <li>
                        <a href="#"> Cadastre-se</a>
                    </li>
                    <li>
                        <a href="#" class="login-btn">Entrar</a>
                    </li>
                </ul>
            </nav>
        </div>
    </div>

    <!-- Main -->
    <main>
        <section class="login-container">
            <div  class="main-title">
                <h1>Entrar</h1>
            </div>

            <form action="logar" method="POST" id="">

            </form>

            <div class="login1">
                <input type="text" name="email" placeholder="Email">    
                <input type="password" name="password" placeholder="Senha">
            </div>
            <div class="login2">
                <input type="checkbox" name="optionals[]" value="remebered">
                <label for="remember">Lembre-se de mim</label>
            </div>
            <div class="login3">
                <a href="#" class="btn-login">Entrar</a>
                <a href="#" class="forget-password">Esqueceu a senha?</a>
            </div>
            <img src="images/estudantes2.png" alt="estudantes" class="students2">
        </section>
    </main>    

    <footer>
        <img src="images/icone1.jpeg" alt="Icone CPA" class="logo">
        <p>SIS CPA - 2024</p>
    </footer>
</body>
</html>
