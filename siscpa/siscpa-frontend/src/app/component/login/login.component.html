    <main>
        <section class="login-container">
            <div  class="main-title">
                <h1>Entrar</h1>
            </div>
            <div class="login1">
                <input type="text" name="email" placeholder="Email">

            <div class="login2">
                <input type="checkbox" name="optionals[]" value="remebered">
                <label for="remember">Lembre-se de mim</label>

            <div class="login3">
                <a [routerLink]="['/user-profile']" class="btn-login">Entrar</a>
                <a [routerLink]="['/forget-password']" class="forget-password">Esqueceu a senha?</a>
            </div>
            <img src="../../../assets/images/estudantes2.png" alt="estudantes" class="students2">
        </section>
    </main>
