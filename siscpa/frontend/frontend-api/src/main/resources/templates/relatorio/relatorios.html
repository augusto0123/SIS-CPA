<!DOCTYPE html>
<html layout:decorate="~{layout}">
<head>
    <meta charset="UTF-8">
    <title>Relatórios</title>
    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
          integrity="sha512-SnH5WK+bZxgPHs44uWIX+LLJAJ9/2PkPKZ5QiAj6Ta86w+fsb2TkcmfRyVX3pBnMFcV7oQPJkl9QevSCWr3W6A=="
          crossorigin="anonymous"
          referrerpolicy="no-referrer" />
    <link href="/assets/css/style.css" rel="stylesheet">
</head>
<body>

<div layout:fragment="body">

    <main id="main" class="main" style="padding: 20px; background-color: #f9f9f9;"> <!-- Similar padding and background color -->

        <!-- Page Title -->
        <div class="pagetitle" style="text-align: center; margin-bottom: 20px;">
            <h1 style="font-size: 28px; color: #333;">Relatórios</h1>
            <nav>
                <ol class="breadcrumb" style="justify-content: center; padding: 10px; background: #e9ecef; border-radius: 8px;">
                    <li class="breadcrumb-item"><a href="index-membroCPA.html" style="color: #0066cc;">Inicio</a></li>
                    <li class="breadcrumb-item">Relatórios</li>
                    <li class="breadcrumb-item active" style="font-weight: bold; color: #333;">Relatórios por Edição</li>
                </ol>
            </nav>
        </div>

        <!-- Section for Edições -->
        <section class="section">

            <!-- Edições Em Andamento -->
            <div class="row" style="display: flex; flex-wrap: wrap; gap: 20px;">
                <div th:each="edicao : ${edicoes}" th:if="${edicao.situacao == 'Em Andamento'}" class="col-lg-6"
                     style="background: #ffffff; border: 1px solid #ddd; border-radius: 8px; padding: 20px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); width: 300px;">
                    <h5 class="card-title-edicao-cadastrar" style="font-size: 20px; font-weight: bold; color: white; text-align: center; margin-bottom: 15px;">
                        Edição Nº: <span th:text="${edicao.edicao}"></span>
                    </h5>
                    <div class="card-body-edicao">
                        <div class="display-edicao" style="margin-bottom: 15px; text-align: center;">
                            <i class="fa-solid fa-chart-simple" style="font-size: 36px; color: white;"></i>
                        </div>
                        <ul class="situacao-lista" style="list-style: none; padding: 0; margin: 0;">
                            <li class="situacao" th:classappend="${edicao.situacao == 'Em Andamento'} ? 'bg-success' : ''"
                                style="background: #d4edda; padding: 10px; border-radius: 5px; color: white; margin-bottom: 5px;">
                                Situação: <span th:text="${edicao.situacao}"></span>
                            </li>
                            <li class="data" style="padding: 5px; font-size: 14px; color: #333;">
                                Data / Início: <span th:text="${edicao.dataInicio}"></span>
                            </li>
                            <li class="data" style="padding: 5px; font-size: 14px; color: #333;">
                                Data / Término: <span th:text="${edicao.dataFim}"></span>
                            </li>
                        </ul>
                        <div style="text-align: center; margin-top: 15px;">
                            <a class="btn btn-primary"
                               th:if="${edicao.situacao == 'Encerrada'}"
                               th:href="@{/relatorio/relatorios-edicao/{id} (id=${edicao.id})}"
                               style="background: #0066cc; color: #fff; padding: 10px 20px; border-radius: 5px; text-decoration: none;">
                                Visualizar Relatórios
                            </a>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Edições Encerradas -->
            <div class="row" style="display: flex; flex-wrap: wrap; gap: 20px;">
                <h2 style="width: 100%; font-size: 28px; font-weight: bold; color: #333; margin: 20px 0; text-align: center;
                     border-bottom: 3px solid #0066cc; padding-bottom: 10px;">
                    Edições Encerradas
                </h2>
                <div th:each="edicao : ${edicoes}" th:if="${edicao.situacao == 'Encerrada'}" class="col-lg-6"
                     style="background: #ffffff; border: 1px solid #ddd; border-radius: 8px; padding: 20px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); width: 300px;">
                    <h5 class="card-title-edicao-cadastrar" style="font-size: 20px; font-weight: bold; color: white; text-align: center; margin-bottom: 15px;">
                        Edição Nº: <span th:text="${edicao.edicao}"></span>
                    </h5>
                    <div class="card-body-edicao">
                        <div class="display-edicao" style="margin-bottom: 15px; text-align: center;">
                            <i class="fa-solid fa-chart-simple" style="font-size: 36px; color: white;"></i>
                        </div>
                        <ul class="situacao-lista" style="list-style: none; padding: 0; margin: 0;">
                            <li class="situacao" th:classappend="${edicao.situacao == 'Encerrada'} ? 'bg-danger' : ''"
                                style="background: #f8d7da; padding: 10px; border-radius: 5px; color: white; margin-bottom: 5px;">
                                Situação: <span th:text="${edicao.situacao}"></span>
                            </li>
                            <li class="data" style="padding: 5px; font-size: 14px; color: #333;">
                                Data / Início: <span th:text="${edicao.dataInicio}"></span>
                            </li>
                            <li class="data" style="padding: 5px; font-size: 14px; color: #333;">
                                Data / Término: <span th:text="${edicao.dataFim}"></span>
                            </li>
                        </ul>
                        <div style="text-align: center; margin-top: 15px;">
                            <a class="btn btn-primary"
                               th:if="${edicao.situacao == 'Encerrada'}"
                               th:href="@{/relatorio/relatorios-edicao/{id} (id=${edicao.id})}"
                               style="background: #0066cc; color: #fff; padding: 10px 20px; border-radius: 5px; text-decoration: none;">
                                Visualizar Relatórios
                            </a>
                        </div>
                    </div>
                </div>
            </div>

        </section>
    </main>
</div>

</body>
</html>
