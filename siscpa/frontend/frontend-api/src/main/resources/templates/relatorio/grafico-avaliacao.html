<!DOCTYPE html>
<html layout:decorate="~{layout}">
<head>
    <meta charset="UTF-8">
    <title>Visualizar Gráficos das Avaliações</title>
    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
          integrity="sha512-SnH5WK+bZxgPHs44uWIX+LLJAJ9/2PkPKZ5QiAj6Ta86w+fsb2TkcmfRyVX3pBnMFcV7oQPJkl9QevSCWr3W6A=="
          crossorigin="anonymous"
          referrerpolicy="no-referrer" />

    <link href="/assets/css/style.css" rel="stylesheet">
</head>
<body>

<div layout:fragment="body">

    <main id="main" class="main">

        <div class="pagetitle">
            <h1>Gráficos</h1>
            <nav>
                <ol class="breadcrumb">
                    <li class="breadcrumb-item"><a href="index-user.html">Inicio</a></li>
                    <li class="breadcrumb-item">Relatórios</li>
                    <li class="breadcrumb-item active">Gráficos</li>
                </ol>
            </nav>
        </div>

        <section class="section">

            <div class="row">

                <div class="col-12">
                    <input type="hidden" name="edicaoId" class="form-control" th:value="${edicaoId}" id="edicaoId">
                </div>

                <div class="row grafico-edicao mb-5" th:each="avaliacao : ${avaliacoes}">
                    <div class="col-lg-12 display-grafico">
                        <div class="col-lg-12 row">
                            <div class="col-lg-12 col-md-6 col-sm-12 mb-4 ms-0">
                                <div class="card-avaliacao-grafico">
                                    <h5 class="card-title-avaliacao-cadastrar" th:text="${avaliacao.tema}"></h5>
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- Gráfico de barra  -->
                    <div class="col-lg-6">
                        <div class="card">

                            <div class="card-body">
                                <h5 class="card-title">Total de Avaliações</h5>

                                <!-- Bar Chart -->
                                <canvas th:id="'barChart' + ${avaliacao.id}" style="max-height: 400px;"></canvas>

                                <!-- End Bar Chart -->

                            </div>
                        </div>
                    </div>


<!--                     Gráfico de pizza-->

                    <div class="col-lg-6">
                        <div class="card">
                            <div class="card-body">
                                <h5 class="card-title">Descrição da Avaliação</h5>

                                <p th:text="${avaliacao.descricao}"></p>

                                <!-- Pie Chart -->

                                <!-- End Pie Chart -->

                            </div>
                        </div>
                    </div>

<!--                    Fim do card              -->
                </div>

            </div>
        </section>

    </main><!-- End #main -->

    <a href="#" class="back-to-top d-flex align-items-center justify-content-center"><i class="bi bi-arrow-up-short"></i></a>

    <!-- Vendor JS Files -->
    <script src="/assets/vendor/apexcharts/apexcharts.min.js"></script>
    <script src="/assets/vendor/bootstrap/js/bootstrap.bundle.min.js"></script>
    <script src="/assets/vendor/chart.js/chart.umd.js"></script>
    <script src="/assets/vendor/echarts/echarts.min.js"></script>
    <script src="/assets/vendor/quill/quill.js"></script>
    <script src="/assets/vendor/simple-datatables/simple-datatables.js"></script>
    <script src="/assets/vendor/tinymce/tinymce.min.js"></script>
    <script src="/assets/vendor/php-email-form/validate.js"></script>

    <!-- Template Main JS File -->
    <script src="/assets/js/main.js"></script>

    <script>
        document.addEventListener("DOMContentLoaded", function () {
          setTimeout(() => {
            carregarGraficoBarras();
          }, 500);
        });

        function carregarGraficoBarras() {
          const edicaoIdElement = document.getElementById("edicaoId");

          if (!edicaoIdElement) {
            console.error("Elemento com id 'edicaoId' não encontrado.");
            return;
          }

          const edicaoId = edicaoIdElement.value;

          fetch(
            "http://localhost:8091/api/resposta/findObjetivaByAvaliacaoId/" + edicaoId
          )
            .then((response) => response.json())
            .then((dadosGraficos) => {
              const transformedData = dadosGraficos.reduce((acc, curr) => {
                let avaliacao = acc.find((a) => a.avaliacaoId === curr.avaliacaoId);

                if (!avaliacao) {
                  avaliacao = { avaliacaoId: curr.avaliacaoId, dados: {} };
                  acc.push(avaliacao);
                }
                avaliacao.dados[curr.label] =
                  (avaliacao.dados[curr.label] || 0) + curr.total;

                return acc;
              }, []);

              transformedData.forEach((data) => {
                new Chart(document.querySelector("#barChart" + data.avaliacaoId), {
                  type: "bar",
                  data: {
                    labels: [
                      "Concordo Totalmente",
                      "Concordo",
                      "Neutro",
                      "Discordo",
                      "Discordo Totalmente",
                    ],
                    datasets: [
                      {
                        label: "Avaliações",
                        data: [
                          data.dados["Concordo Totalmente"],
                          data.dados["Concordo"],
                          data.dados["Neutro"],
                          data.dados["Discordo"],
                          data.dados["Discordo Totalmente"],
                        ],
                        backgroundColor: [
                          "rgba(75, 192, 192, 1)",
                          "rgba(54, 162, 235, 1)",
                          "rgba(255, 205, 86, 1)",
                          "rgba(255, 159, 64, 1)",
                          "rgba(255, 99, 132, 1)",
                        ],
                        borderColor: [
                          "rgb(75, 192, 192)",
                          "rgb(54, 162, 235)",
                          "rgb(255, 205, 86)",
                          "rgb(255, 159, 64)",
                          "rgb(255, 99, 132)",
                        ],
                        borderWidth: 2,
                      },
                    ],
                  },
                  options: {
                    scales: {
                      y: {
                        beginAtZero: true,
                      },
                    },
                  },
                });
              });
            })
            .catch((error) => console.error("Erro ao buscar dados:", error));
        }
    </script>

</div>

</body>
</html>
