<!DOCTYPE html>
<html layout:decorate="~{layout}">
<head>
    <meta charset="UTF-8">
    <title>Visualizar Gráficos dos Grupos de Perguntas</title>
    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
          integrity="sha512-SnH5WK+bZxgPHs44uWIX+LLJAJ9/2PkPKZ5QiAj6Ta86w+fsb2TkcmfRyVX3pBnMFcV7oQPJkl9QevSCWr3W6A=="
          crossorigin="anonymous"
          referrerpolicy="no-referrer" />

    <link href="/assets/css/style.css" rel="stylesheet">
</head>
<body>

<div layout:fragment="body">

    <main id="main" class="main">

        <div class="pagetitle">
            <h1>Gráficos</h1>
            <nav>
                <ol class="breadcrumb">
                    <li class="breadcrumb-item"><a href="index-user.html">Inicio</a></li>
                    <li class="breadcrumb-item">Relatórios</li>
                    <li class="breadcrumb-item active">Gráficos</li>
                </ol>
            </nav>
        </div>

        <section class="section">

            <div class="row">

                <div class="row grafico-edicao">
                    <div class="col-lg-12 display-grafico">
                        <div class="col-lg-12 row">
                            <div class="col-lg-12 col-md-6 col-sm-12 mb-4 ms-0">
                                <div class="card-grupo-grafico">
                                    <h5 class="card-title-grupo">Assunto do Grupo de Perguntas</h5>
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- Gráfico de barra  -->
                    <div class="col-lg-6">
                        <div class="card">
                            <div class="card-body">
                                <h5 class="card-title">Total de Avaliações (Barra)</h5>

                                <!-- Bar Chart -->
                                <canvas id="barChart1" style="max-height: 400px;"></canvas>
                                <script>
                                    document.addEventListener("DOMContentLoaded", () => {
                                        new Chart(document.querySelector('#barChart1'), {
                                            type: 'bar',
                                            data: {  // Corrigido de reviews para data
                                                labels: ['Concordo Totalmente', 'Concordo', 'Neutro', 'Discordo', 'Discordo Totalmente'],
                                                datasets: [{
                                                    label: 'Avaliações',
                                                    data: [65, 59, 80, 81, 56],  // Corrigido para ter o mesmo número de elementos que labels
                                                    backgroundColor: [
                                                        'rgba(75, 192, 192, 1)',  // Opacidade 1
                                                        'rgba(54, 162, 235, 1)',
                                                        'rgba(255, 205, 86, 1)',
                                                        'rgba(255, 159, 64, 1)',
                                                        'rgba(255, 99, 132, 1)'
                                                    ],
                                                    borderColor: [
                                                        'rgb(75, 192, 192)',
                                                        'rgb(54, 162, 235)',
                                                        'rgb(255, 159, 64)',
                                                        'rgb(255, 205, 86)',
                                                        'rgb(255, 99, 132)'
                                                    ],
                                                    borderWidth: 2  // Aumentar a largura da borda se desejado
                                                }]
                                            },
                                            options: {
                                                scales: {
                                                    y: {
                                                        beginAtZero: true
                                                    }
                                                }
                                            }
                                        });
                                    });
                                </script>
                                <!-- End Bar Chart -->

                            </div>
                        </div>
                    </div>

                    <!-- Gráfico de pizza  -->
                    <div class="col-lg-6">
                        <div class="card">
                            <div class="card-body">
                                <h5 class="card-title">Total de Avaliações (Pizza)</h5>

                                <!-- Pie Chart -->
                                <canvas id="pieChart1" style="max-height: 400px;"></canvas>
                                <script>
                                    document.addEventListener("DOMContentLoaded", () => {
                                        new Chart(document.querySelector('#pieChart1'), {
                                            type: 'pie',
                                            data: {
                                                labels: [
                                                    'Concordo Totalmente',
                                                    'Concordo',
                                                    'Neutro',
                                                    'Discordo',
                                                    'Discordo Totalmente'
                                                ],
                                                datasets: [{
                                                    label: 'Avaliações',
                                                    data: [50, 80, 25, 30, 40],
                                                    backgroundColor: [
                                                        'rgb(34, 139, 34)',
                                                        'rgb(54, 162, 235)',
                                                        'rgb(255, 99, 132)',
                                                        'rgb(255, 165, 0)',
                                                        'rgb(255, 205, 86)'
                                                    ],
                                                    hoverOffset: 4
                                                }]
                                            }
                                        });
                                    });
                                </script>
                                <!-- End Pie Chart -->

                            </div>
                        </div>
                    </div>
                </div>

            </div>
        </section>

    </main><!-- End #main -->

    <a href="#" class="back-to-top d-flex align-items-center justify-content-center"><i class="bi bi-arrow-up-short"></i></a>

    <!-- Vendor JS Files -->
    <script src="/assets/vendor/apexcharts/apexcharts.min.js"></script>
    <script src="/assets/vendor/bootstrap/js/bootstrap.bundle.min.js"></script>
    <script src="/assets/vendor/chart.js/chart.umd.js"></script>
    <script src="/assets/vendor/echarts/echarts.min.js"></script>
    <script src="/assets/vendor/quill/quill.js"></script>
    <script src="/assets/vendor/simple-datatables/simple-datatables.js"></script>
    <script src="/assets/vendor/tinymce/tinymce.min.js"></script>
    <script src="/assets/vendor/php-email-form/validate.js"></script>

    <!-- Template Main JS File -->
    <script src="/assets/js/main.js"></script>

</div>

</body>
</html>
