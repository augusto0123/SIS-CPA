<!DOCTYPE html>

<body>

<div layout:fragment="body">

    <main id="main" class="main">

        <div class="pagetitle">
            <h1>Cadastrar Grupo de Perguntas</h1>
            <nav>
                <ol class="breadcrumb">
                    <li class="breadcrumb-item"><a href="index-membroCPA.html">Incio</a></li>
                    <li class="breadcrumb-item">Avaliação</li>
                    <li class="breadcrumb-item active">Grupo de Perguntas</li>
                </ol>

        <section class="section">

                    <div class="card">
                        <div class="card-body">

                            <div class="col-12">
                                <label for="inputPassword" class="col-sm-2 col-form-label">Descrição</label>
                                <div class="">
                                    <textarea class="form-control" style="height: 100px"></textarea>
                                </div>
                            </div>

                            <div class="col-12">
                                <label for="yourName" class="form-label">Tipo</label>
                                <input type="text" name="name" class="form-control" id="yourName" required>
                            </div>

                        </button>

                            <div class="modal-dialog">
                                <div class="modal-content">
                                    <div class="modal-header">
                                        <h5 class="modal-title">Grupo de Perguntas</h5>
                                        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                                    </div>
                                    <div class="modal-body">
                                        Tem certeza que deseja Criar Perguntas para o Grupo?
                                    </div>
                                    <div class="modal-footer">
                                        <a href="create-question-membroCPA.html" class="btn btn-primary">Criar Perguntas</a>
                                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Voltar</button>
                                    </div>

                            </div>
                        </div>

                        </form>
                    </div>

</div>
