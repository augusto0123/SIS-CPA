<!DOCTYPE html>
<html layout:decorate="~{layout}">
<head>
    <meta charset="UTF-8">
    <title>Responder Perguntas</title>
</head>
<body class="body-pergunta">

<div layout:fragment="body">

    <main id="main" class="main">

        <div class="pagetitle">
            <h1>Listar Perguntas</h1>
            <nav>
                <ol class="breadcrumb">
                    <li class="breadcrumb-item"><a href="#">EDIÇÃO (Nº)</a></li>
                    <li class="breadcrumb-item"><a href="#"> QUESTIONARIO DO (PAPEL)</a></li>
                    <li class="breadcrumb-item active">TEMA DO GRUPO DE PERGUNTAS</li>
                </ol>
            </nav>
        </div>

        <section class="section-pergunta">
            <div class="row">

                <div class="col-lg-8">
                    <div class="card">
                        <h5 class="card-title-grupo">(Tema do Grupo)</h5>
                        <div class="card-body-responder">
                            <form class="row g-3 needs-validation" novalidate>
                                <div class="questao-objetiva">
                                    <div class="mb-3">
                                        <span class="form-label-span">Texto da pergunta</span>
                                    </div>
                                    <div class="mb-3">
                                        <label class="form-label">Escolha uma opção:</label>
                                        <div>
                                            <div class="form-check">
                                                <input class="form-check-input" type="radio" name="likert" id="likert1" value="1" required>
                                                <label class="form-check-label" for="likert1">Péssimo</label>
                                            </div>
                                            <div class="form-check">
                                                <input class="form-check-input" type="radio" name="likert" id="likert2" value="2" required>
                                                <label class="form-check-label" for="likert2">Ruim</label>
                                            </div>
                                            <div class="form-check">
                                                <input class="form-check-input" type="radio" name="likert" id="likert3" value="3" required>
                                                <label class="form-check-label" for="likert3">Regular</label>
                                            </div>
                                            <div class="form-check">
                                                <input class="form-check-input" type="radio" name="likert" id="likert4" value="4" required>
                                                <label class="form-check-label" for="likert4">Bom</label>
                                            </div>
                                            <div class="form-check">
                                                <input class="form-check-input" type="radio" name="likert" id="likert5" value="5" required>
                                                <label class="form-check-label" for="likert5">Excelente</label>
                                            </div>
                                        </div>
                                    </div>
                                </div>

                                <div class="questao-subjetiva">
                                    <div class="mb-3">
                                        <label for="resposta" class="form-label-span2">Texto da Pergunta</label>
                                        <textarea class="form-control" id="resposta" rows="3" placeholder="Responda aqui..." required></textarea>
                                    </div>
                                </div>

                                <div class="text-end">
                                    <button type="submit" class="btn btn-primary btn-md">Enviar</button>
                                </div>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <a href="#" class="back-to-top d-flex align-items-center justify-content-center"><i class="bi bi-arrow-up-short"></i></a>

    <script src="/assets/vendor/apexcharts/apexcharts.min.js"></script>
    <script src="/assets/vendor/bootstrap/js/bootstrap.bundle.min.js"></script>
    <script src="/assets/vendor/chart.js/chart.umd.js"></script>
    <script src="/assets/vendor/echarts/echarts.min.js"></script>
    <script src="/assets/vendor/quill/quill.js"></script>
    <script src="/assets/vendor/simple-datatables/simple-datatables.js"></script>
    <script src="/assets/vendor/tinymce/tinymce.min.js"></script>
    <script src="/assets/vendor/php-email-form/validate.js"></script>

    <script src="/assets/js/main.js"></script>

</div>

</body>
</html>
