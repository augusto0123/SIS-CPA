<!DOCTYPE html>
<html layout:decorate="~{layout}">
<head>
    <meta charset="UTF-8">
    <title>Responder Perguntas</title>
</head>
<body>

<div layout:fragment="body">

    <main id="main" class="main">

        <div class="pagetitle">
            <h1>Questionário</h1>
            <nav>
                <ol class="breadcrumb">
                    <li class="breadcrumb-item"><a href="index-user.html">Inicio</a></li>
                    <li class="breadcrumb-item">Avaliações</li>
                    <li class="breadcrumb-item active">Questionário Abertos</li>
                </ol>
            </nav>
        </div>

        <section class="section">
            <div class="row">
                <div class="col-lg-6">

                    <div class="card">
                        <div class="card-body">
                            <h5 class="card-title">Grupo: Qualidade de Ensino</h5>
                            <h6 class="card-subtitle mb-3">Edição: 2024</h6>

                            <!-- Grupo 1 -->
                            <div class="mb-4">

                                <!-- Pergunta 2: Objetiva -->
                                <div class="mb-3">
                                    <label class="label1">1. Como você avaliaria a eficácia das metodologias de ensino utilizadas pelos professores?</label>
                                    <div class="form-check">
                                        <input class="form-check-input" type="radio" id="objetiva1a" name="pergunta2" value="a">
                                        <label for="objetiva1a" class="form-check-label"> Excelente</label>
                                    </div>
                                    <div class="form-check">
                                        <input class="form-check-input" type="radio" id="objetiva1b" name="pergunta2" value="b">
                                        <label for="objetiva1b" class="form-check-label"> Bom</label>
                                    </div>
                                    <div class="form-check">
                                        <input class="form-check-input" type="radio" id="objetiva1c" name="pergunta2" value="c">
                                        <label for="objetiva1c" class="form-check-label"> Regular</label>
                                    </div>
                                    <div class="form-check">
                                        <input class="form-check-input" type="radio" id="objetiva1d" name="pergunta2" value="d">
                                        <label for="objetiva1d" class="form-check-label"> Ruim</label>
                                    </div>
                                    <div class="form-check">
                                        <input class="form-check-input" type="radio" id="objetiva1e" name="pergunta2" value="e">
                                        <label for="objetiva1e" class="form-check-label"> Péssimo</label>
                                    </div>
                                </div>
                                <br>

                                <!-- Pergunta 2: Objetiva -->
                                <div class="mb-3">
                                    <label class="label1">2. Como você avaliaria a relação entre professores e alunos em termos de acessibilidade e apoio?</label>
                                    <div class="form-check">
                                        <input class="form-check-input" type="radio" id="objetiva1a" name="pergunta2" value="a">
                                        <label for="objetiva1a" class="form-check-label"> Excelente</label>
                                    </div>
                                    <div class="form-check">
                                        <input class="form-check-input" type="radio" id="objetiva1b" name="pergunta2" value="b">
                                        <label for="objetiva1b" class="form-check-label"> Bom</label>
                                    </div>
                                    <div class="form-check">
                                        <input class="form-check-input" type="radio" id="objetiva1c" name="pergunta2" value="c">
                                        <label for="objetiva1c" class="form-check-label"> Regular</label>
                                    </div>
                                    <div class="form-check">
                                        <input class="form-check-input" type="radio" id="objetiva1d" name="pergunta2" value="d">
                                        <label for="objetiva1d" class="form-check-label"> Ruim</label>
                                    </div>
                                    <div class="form-check">
                                        <input class="form-check-input" type="radio" id="objetiva1e" name="pergunta2" value="e">
                                        <label for="objetiva1e" class="form-check-label"> Péssimo</label>
                                    </div>
                                </div>
                                <br>

                                <!-- Pergunta 2: Objetiva -->
                                <div class="mb-3">
                                    <label class="label1">3. Como você avaliaria a clareza dos critérios de avaliação utilizados pelos professores?</label>
                                    <div class="form-check">
                                        <input class="form-check-input" type="radio" id="objetiva1a" name="pergunta2" value="a">
                                        <label for="objetiva1a" class="form-check-label"> Excelente</label>
                                    </div>
                                    <div class="form-check">
                                        <input class="form-check-input" type="radio" id="objetiva1b" name="pergunta2" value="b">
                                        <label for="objetiva1b" class="form-check-label"> Bom</label>
                                    </div>
                                    <div class="form-check">
                                        <input class="form-check-input" type="radio" id="objetiva1c" name="pergunta2" value="c">
                                        <label for="objetiva1c" class="form-check-label"> Regular</label>
                                    </div>
                                    <div class="form-check">
                                        <input class="form-check-input" type="radio" id="objetiva1d" name="pergunta2" value="d">
                                        <label for="objetiva1d" class="form-check-label"> Ruim</label>
                                    </div>
                                    <div class="form-check">
                                        <input class="form-check-input" type="radio" id="objetiva1e" name="pergunta2" value="e">
                                        <label for="objetiva1e" class="form-check-label"> Péssimo</label>
                                    </div>
                                </div>
                                <br>


                                <!-- Pergunta 1: Subjetiva -->
                                <div class="mb-3">
                                    <label for="experiencia" class="form-label">4. Deixe uma sugestão ou observação de melhoria:</label>
                                    <textarea class="form-control" id="experiencia" style="height: 100px"></textarea>
                                </div>
                            </div>

                            <!-- Botão de Envio -->
                            <button type="button" class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#disablebackdrop">
                                Enviar
                            </button>

                            <!-- Modal de Confirmação -->
                            <div class="modal fade" id="disablebackdrop" tabindex="-1" data-bs-backdrop="false">
                                <div class="modal-dialog">
                                    <div class="modal-content">
                                        <div class="modal-header">
                                            <h5 class="modal-title">Questionário do Aluno</h5>
                                            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                                        </div>
                                        <div class="modal-body">
                                            Suas respostas foram enviadas!
                                        </div>
                                        <div class="modal-footer">
                                            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Voltar</button>
                                        </div>
                                    </div>
                                </div>
                            </div>

                        </div>
                    </div>

                </div>
            </div>
        </section>
    </main>


    <a href="#" class="back-to-top d-flex align-items-center justify-content-center"><i class="bi bi-arrow-up-short"></i></a>

    <script src="/assets/vendor/apexcharts/apexcharts.min.js"></script>
    <script src="/assets/vendor/bootstrap/js/bootstrap.bundle.min.js"></script>
    <script src="/assets/vendor/chart.js/chart.umd.js"></script>
    <script src="/assets/vendor/echarts/echarts.min.js"></script>
    <script src="/assets/vendor/quill/quill.js"></script>
    <script src="/assets/vendor/simple-datatables/simple-datatables.js"></script>
    <script src="/assets/vendor/tinymce/tinymce.min.js"></script>
    <script src="/assets/vendor/php-email-form/validate.js"></script>

    <script src="/assets/js/main.js"></script>

</div>

</html>
