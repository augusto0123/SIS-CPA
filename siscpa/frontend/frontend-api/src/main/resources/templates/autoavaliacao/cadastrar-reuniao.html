<!DOCTYPE html>
<html layout:decorate="~{layout}">
<head>
    <meta charset="UTF-8">
    <title>Cadastrar Reuniao</title>
</head>
<body>

<div layout:fragment="body">

    <main id="main" class="main">

        <div class="pagetitle">
            <h1>Agendar Reunião</h1>
            <nav>
                <ol class="breadcrumb">
                    <li class="breadcrumb-item"><a href="index-membroCPA.html">Inicio</a></li>
                    <li class="breadcrumb-item">Avaliação</li>
                    <li class="breadcrumb-item active">Reunião CPA</li>
                </ol>
            </nav>
        </div>

        <section class="section">
            <div class="row">

                <div class="col-lg-12">

                    <div class="card">

                        <div class="card-body-reuniao">

                            <h5 class="card-title-cadastrar-instituicao">Reunião CPA</h5>

                            <form class="row g-3 needs-validation" novalidate method="POST" th:action="@{/autoavaliacao/criar-reuniao}">

                                <div class="row my-4">
                                    <label for="dataReuniao" class="col-sm-1 col-form-label">Data</label>
                                    <div class="col-sm-11">
                                        <input type="date" class="form-control" name="dataReuniao" id="dataReuniao" required>
                                    </div>
                                </div>
                                <div class="row my-4">
                                    <label for="horario" class="col-sm-1 col-form-label">Hora</label>
                                    <div class="col-sm-11">
                                        <input type="time" class="form-control" name="horario" id="horario" required>
                                    </div>
                                </div>

                                <div class="row my-4">
                                    <label for="pauta" class="col-sm-1 col-form-label">Pauta</label>
                                    <div class="col-sm-11">
                                        <textarea class="form-control" style="height: 300px" name="pauta" id="pauta" placeholder="Digite aqui..." required></textarea>
                                    </div>
                                </div>

                                <div class="text-end my-3">
                                    <button class="btn btn-primary btn-lg me-4" data-bs-toggle="modal" data-bs-target="#disablebackdrop" style="width: 200px; height: 50px;">
                                        Cadastrar
                                    </button>
                                </div>


                                <div class="modal fade" id="disablebackdrop" tabindex="-1" data-bs-backdrop="false">
                                    <div class="modal-dialog">
                                        <div class="modal-content">
                                            <div class="modal-header">
                                                <h5 class="modal-title">Reunião CPA</h5>
                                                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                                            </div>
                                            <div class="modal-body">
                                                Sua reunião foi enviada com sucesso!
                                            </div>
                                            <div class="modal-footer">
                                                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Voltar</button>
                                            </div>
                                        </div>
                                    </div>
                                </div>

                            </form>

                        </div>
                    </div>

                </div>
            </div>
        </section>

    </main>

    <a href="#" class="back-to-top d-flex align-items-center justify-content-center"><i class="bi bi-arrow-up-short"></i></a>

    <script src="/assets/vendor/apexcharts/apexcharts.min.js"></script>
    <script src="/assets/vendor/bootstrap/js/bootstrap.bundle.min.js"></script>
    <script src="/assets/vendor/chart.js/chart.umd.js"></script>
    <script src="/assets/vendor/echarts/echarts.min.js"></script>
    <script src="/assets/vendor/quill/quill.js"></script>
    <script src="/assets/vendor/simple-datatables/simple-datatables.js"></script>
    <script src="/assets/vendor/tinymce/tinymce.min.js"></script>
    <script src="/assets/vendor/php-email-form/validate.js"></script>
    <script src="/assets/js/main.js"></script>


</div>

</body>
</html>
