<!DOCTYPE html>
<html layout:decorate="~{layout}">
<head>
    <meta charset="UTF-8">
    <title>Vincular Avaliação</title>
    <!--  Icones   -->
    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
          integrity="sha512-SnH5WK+bZxgPHs44uWIX+LLJAJ9/2PkPKZ5QiAj6Ta86w+fsb2TkcmfRyVX3pBnMFcV7oQPJkl9QevSCWr3W6A=="
          crossorigin="anonymous"
          referrerpolicy="no-referrer" />

    <link href="/assets/css/style.css" rel="stylesheet">
</head>
<body>

<div layout:fragment="body">

    <main id="main" class="main">

        <div class="pagetitle">
            <h1>Vincular Questionário</h1>
            <nav>
                <ol class="breadcrumb">
                    <li class="breadcrumb-item"><a href="index-membroCPA.html">Inicio</a></li>
                    <li class="breadcrumb-item">Avaliações</li>
                    <li class="breadcrumb-item active">Vincular Avaliação</li>
                </ol>
            </nav>
        </div>

        <section class="section">
            <div class="row">

                <div class="col-lg-5 col-md-6 col-sm-12 mb-4 mx-4" th:each="avaliacao : ${avaliacoes}">

                    <h5 class="card-title-avaliacao-cadastrar">
                        <span th:text="${avaliacao.tema}"></span>

                        <div th:if="${avaliacao.edicaoId != 0}">
                            <i class="fa-solid fa-bookmark text-warning"
                               data-bs-toggle="tooltip"
                               th:title="'Esta avaliação já está vinculada à edição ' + ${avaliacao.edicaoId}"
                               style="cursor: pointer;"></i>
                        </div>
                    </h5>


                    <div class="card-avaliacao">

                        <form method="POST" th:action="@{/autoavaliacao/vincular-avaliacao}">
                            <div class="card-body-avaliacao">

                                <div class="col-12">
                                    <input type="hidden" name="edicaoId" class="form-control" id="edicaoId" th:value="${edicaoId}">
                                </div>

                                <div class="col-12">
                                    <input type="hidden" name="avaliacaoId" class="form-control" id="avaliacaoId" th:value="${avaliacao.id}">
                                </div>

                                <div>
                                    <i class="fa-solid fa-circle-check"></i>
                                </div>

                                <div class="table-edicao">
                                    <span th:text="${avaliacao.descricao}"></span>
                                </div>

                                <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#disablebackdrop">
                                    Vincular
                                </button>
                            </div>

                            <div class="modal fade" id="disablebackdrop" tabindex="-1" data-bs-backdrop="false" style="display: none;" aria-hidden="true">
                                <div class="modal-dialog">
                                    <div class="modal-content">
                                        <div class="modal-header">
                                            <h5 class="modal-title">Vincular avaliação á edição</h5>
                                            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                                        </div>
                                        <div class="modal-body">
                                            Avaliação vinculada com sucesso!
                                        </div>
                                        <div class="modal-footer">
                                            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Voltar</button>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </form>

                    </div>
                </div>

            </div>
        </section>

    </main>

    <a href="#" class="back-to-top d-flex align-items-center justify-content-center"><i class="bi bi-arrow-up-short"></i></a>

    <script src="/assets/vendor/apexcharts/apexcharts.min.js"></script>
    <script src="/assets/vendor/bootstrap/js/bootstrap.bundle.min.js"></script>
    <script src="/assets/vendor/chart.js/chart.umd.js"></script>
    <script src="/assets/vendor/echarts/echarts.min.js"></script>
    <script src="/assets/vendor/quill/quill.js"></script>
    <script src="/assets/vendor/simple-datatables/simple-datatables.js"></script>
    <script src="/assets/vendor/tinymce/tinymce.min.js"></script>
    <script src="/assets/vendor/php-email-form/validate.js"></script>

    <!-- Template Main JS File -->
    <script src="/assets/js/main.js"></script>

</div>

</body>
</html>
