<!DOCTYPE html>
<html layout:decorate="~{layout}">
<head>
    <meta charset="UTF-8">
    <title>Cadastros</title>
<!--    Icones   -->
    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
          integrity="sha512-SnH5WK+bZxgPHs44uWIX+LLJAJ9/2PkPKZ5QiAj6Ta86w+fsb2TkcmfRyVX3pBnMFcV7oQPJkl9QevSCWr3W6A=="
          crossorigin="anonymous"
          referrerpolicy="no-referrer" />

    <link href="/assets/css/style.css" rel="stylesheet">
</head>
<body>

<div layout:fragment="body">

    <main id="main" class="main">

        <div class="pagetitle">
            <h1>Menu de Cadastros</h1>
            <nav>
                <ol class="breadcrumb">
                    <li class="breadcrumb-item"><a href="index-admin.html">Inicio</a></li>
                    <li class="breadcrumb-item">Cadastros</li>
                    <li class="breadcrumb-item active">Menu</li>
                </ol>
            </nav>
        </div>

        <section class="section-menu-autoavaliacao">
            <div class="row">

                <div class="col-lg-5">

                    <div class="card-cadastros mb-4">
                        <a th:href="@{/autoavaliacao/cadastrar-edicao}" class="card-body" style="cursor: pointer;">
                            <div class="card-body-cadastros d-flex align-items-center">
                                <div class="espaco">
                                    <i class="fa-solid fa-chart-simple"></i>
                                </div>
                                <h5 class="card-title mb-0">Cadastrar Edição</h5>
                            </div>
                        </a>
                    </div>

                    <div class="card-cadastros mb-4">
                        <a th:href="@{/autoavaliacao/cadastrar-avaliacao}" class="card-body" style="cursor: pointer;">
                            <div class="card-body-cadastros d-flex align-items-center">
                                <div class="espaco">
                                    <i class="fa-solid fa-circle-check"></i>
                                </div>
                                <h5 class="card-title mb-0">Cadastrar Avaliação</h5>
                            </div>
                        </a>
                    </div>

                    <div class="card-cadastros mb-4">
                        <a th:href="@{/autoavaliacao/cadastrar-questionario}" class="card-body" style="cursor: pointer;">
                            <div class="card-body-cadastros d-flex align-items-center">
                                <div class="espaco">
                                    <i class="fa-solid fa-pen-to-square"></i>
                                </div>
                                <h5 class="card-title mb-0">Cadastrar Questionário</h5>
                            </div>
                        </a>
                    </div>

                    <div class="card-cadastros mb-4">
                        <a th:href="@{/autoavaliacao/cadastrar-grupo}" class="card-body" style="cursor: pointer;">
                            <div class="card-body-cadastros d-flex align-items-center">
                                <div class="espaco">
                                    <i class="fa-solid fa-clipboard-question"></i>
                                </div>
                                <h5 class="card-title mb-0">Cadastrar Grupo de Perguntas</h5>
                            </div>
                        </a>
                    </div>

                    <div class="card-cadastros mb-4">
                        <a th:href="@{/autoavaliacao/cadastrar-pergunta}" class="card-body" style="cursor: pointer;">
                            <div class="card-body-cadastros d-flex align-items-center">
                                <div class="espaco">
                                    <i class="fa-solid fa-circle-question"></i>
                                </div>
                                <h5 class="card-title mb-0">Cadastrar Pergunta</h5>
                            </div>
                        </a>
                    </div>

                </div>

            </div>
        </section>
    </main>

    <a href="#" class="back-to-top d-flex align-items-center justify-content-center"><i class="bi bi-arrow-up-short"></i></a>

    <script src="/assets/vendor/apexcharts/apexcharts.min.js"></script>
    <script src="/assets/vendor/bootstrap/js/bootstrap.bundle.min.js"></script>
    <script src="/assets/vendor/chart.js/chart.umd.js"></script>
    <script src="/assets/vendor/echarts/echarts.min.js"></script>
    <script src="/assets/vendor/quill/quill.js"></script>
    <script src="/assets/vendor/simple-datatables/simple-datatables.js"></script>
    <script src="/assets/vendor/tinymce/tinymce.min.js"></script>
    <script src="/assets/vendor/php-email-form/validate.js"></script>

    <!-- Template Main JS File -->
    <script src="/assets/js/main.js"></script>



</div>

</body>
</html>
