<!DOCTYPE html>
<html layout:decorate="~{layout}">
<head>
    <meta charset="UTF-8">
    <title>Participar da Edição</title>
    <!--  Icones   -->
    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
          integrity="sha512-SnH5WK+bZxgPHs44uWIX+LLJAJ9/2PkPKZ5QiAj6Ta86w+fsb2TkcmfRyVX3pBnMFcV7oQPJkl9QevSCWr3W6A=="
          crossorigin="anonymous"
          referrerpolicy="no-referrer" />

    <link href="/assets/css/style.css" rel="stylesheet">
</head>
<body>

<div layout:fragment="body">

    <main id="main" class="main">

        <div class="pagetitle">
            <h1>Participar das Edições</h1>
            <nav>
                <ol class="breadcrumb">
                    <li class="breadcrumb-item"><a href="index-membroCPA.html">Inicio</a></li>
                    <li class="breadcrumb-item">Autoavaliação</li>
                    <li class="breadcrumb-item active">Edições Dispoíveis</li>
                </ol>
            </nav>
        </div>

        <section class="section">

            <div class="row">

                <div class="col-lg-6 col-md-6 col-sm-12 mb-4 mx-4">

                    <div class="card-edicao">

                        <h5 class="card-title-edicao-cadastrar">Edição (Número da Edição)<span>Ano</span></h5>

                        <div class="card-body-edicao">

                            <div class="display-edicao">
                                <div class="espaco-edicao">
                                    <i class="fa-solid fa-chart-simple"></i>
                                </div>
                                <ul class="situacao-lista">
                                    <li class="situacao em-andamento">Situação: Em Andamento</li>
                                    <li class="data">Data / Início: 01/10/2024</li>
                                    <li class="data">Data / Término: 30/10/2024</li>
                                </ul>
                            </div>
                            <div class="table-edicao">
                                <span>Descrição: seu texto aqui que pode ter até 500 caracteres.</span>
                            </div>

                            <button type="button" class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#basicModal">
                                Participar
                            </button>
                    </div>
                        <div class="modal fade" id="basicModal" tabindex="-1">
                            <div class="modal-dialog">
                                <div class="modal-content">
                                    <div class="modal-header">
                                        <h5 class="modal-title">Deseja participar da edição?</h5>
                                        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                                    </div>

                                    <div class="modal-footer">
                                        <a th:href="@{/autoavaliacao/responder-avaliacao}" class="btn btn-primary">Participar</a>
                                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Voltar</button>
                                    </div>

                                </div>
                            </div>
                        </div>
                    </div>

                </div>
            </div>
        </section>

    </main>

    <a href="#" class="back-to-top d-flex align-items-center justify-content-center"><i class="bi bi-arrow-up-short"></i></a>

    <script src="/assets/vendor/apexcharts/apexcharts.min.js"></script>
    <script src="/assets/vendor/bootstrap/js/bootstrap.bundle.min.js"></script>
    <script src="/assets/vendor/chart.js/chart.umd.js"></script>
    <script src="/assets/vendor/echarts/echarts.min.js"></script>
    <script src="/assets/vendor/quill/quill.js"></script>
    <script src="/assets/vendor/simple-datatables/simple-datatables.js"></script>
    <script src="/assets/vendor/tinymce/tinymce.min.js"></script>
    <script src="/assets/vendor/php-email-form/validate.js"></script>

    <!-- Template Main JS File -->
    <script src="/assets/js/main.js"></script>

</div>

</body>
</html>
