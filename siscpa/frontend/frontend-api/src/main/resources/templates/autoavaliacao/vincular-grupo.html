<!DOCTYPE html>
<html layout:decorate="~{layout}">
<head>
    <meta charset="UTF-8">
    <title>Vincular Grupos de Perguntas</title>
    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
          integrity="sha512-SnH5WK+bZxgPHs44uWIX+LLJAJ9/2PkPKZ5QiAj6Ta86w+fsb2TkcmfRyVX3pBnMFcV7oQPJkl9QevSCWr3W6A=="
          crossorigin="anonymous"
          referrerpolicy="no-referrer"/>

    <link href="/assets/css/style.css" rel="stylesheet">
</head>
<body>

<div layout:fragment="body">

    <main id="main" class="main">

        <div class="pagetitle">
            <h1>Listar Grupo de Perguntas</h1>
            <nav>
                <ol class="breadcrumb">
                    <li class="breadcrumb-item"><a href="index-membroCPA.html">Inicio</a></li>
                    <li class="breadcrumb-item">Avaliação</li>
                    <li class="breadcrumb-item active">Vincular Grupo de Perguntas</li>
                </ol>
            </nav>
        </div>

        <section class="section">
            <div class="row">

                <div class="col-lg-5 col-md-6 col-sm-12 mb-4 mx-4" th:each="grupo : ${grupos}">

                    <h5 class="card-title-grupo">
                        <span th:text="${grupo.tipo}"></span>
<!--                        <span th:text="${grupo.questionarioId}"></span>-->


<!--                        <i class="fa-solid fa-bookmark text-warning"></i>-->

<!--                        <div th:if="${grupo.questionarioId != 0}">-->
<!--                            <i class="fa-solid fa-bookmark text-warning"-->
<!--                               data-bs-toggle="tooltip"-->
<!--                               th:title="'Esse grupo já está vinculado ao questionário ' + ${grupo.questionarioId}"-->
<!--                               style="cursor: pointer;"></i>-->
<!--                        </div>-->
                    </h5>

                    <div class="card-grupo">

                        <form method="POST" th:action="@{/autoavaliacao/vincular-grupo}">
                            <div class="card-body-grupo">

                                <div class="col-12">
                                    <input type="hidden" name="questionarioId" class="form-control" id="questionarioId" th:value="${questionarioId}">
                                </div>

                                <div class="col-12">
                                    <input type="hidden" name="grupoId" class="form-control" id="grupoId" th:value="${grupo.id}">
                                </div>

                                <div>
                                    <i class="fa-solid fa-clipboard-question"></i>
                                </div>

                                <div class="table-edicao">
                                    <span th:text="${grupo.descricao}"></span>
                                </div>

                                <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#disablebackdrop">
                                    Vincular
                                </button>
                            </div>
                        </form>

                    </div>
                </div>

            </div>
        </section>

    </main>


    <a href="#" class="back-to-top d-flex align-items-center justify-content-center"><i class="bi bi-arrow-up-short"></i></a>

    <script src="/assets/vendor/apexcharts/apexcharts.min.js"></script>
    <script src="/assets/vendor/bootstrap/js/bootstrap.bundle.min.js"></script>
    <script src="/assets/vendor/chart.js/chart.umd.js"></script>
    <script src="/assets/vendor/echarts/echarts.min.js"></script>
    <script src="/assets/vendor/quill/quill.js"></script>
    <script src="/assets/vendor/simple-datatables/simple-datatables.js"></script>
    <script src="/assets/vendor/tinymce/tinymce.min.js"></script>
    <script src="/assets/vendor/php-email-form/validate.js"></script>

    <!-- Template Main JS File -->
    <script src="/assets/js/main.js"></script>

</div>

</body>
</html>
