<!DOCTYPE html>
<html layout:decorate="~{layout}">
<head>
    <meta charset="UTF-8">
    <title>Cadastrar Pergunta</title>
</head>
<body>

<div layout:fragment="body">

    <main id="main" class="main">

        <div class="pagetitle">
            <h1>Cadastrar Perguntas</h1>
            <nav>
                <ol class="breadcrumb">
                    <li class="breadcrumb-item"><a href="index-membroCPA.html">Incio</a></li>
                    <li class="breadcrumb-item">Avaliação</li>
                    <li class="breadcrumb-item active">Perguntas</li>
                </ol>
            </nav>
        </div>

        <section class="section">
            <div class="row">

                <div class="col-lg-6">
                    <h2 class="title-tipo-pergunta">Pergunta Objetiva:</h2>

                    <div class="card-pergunta" style="height: 650px">

                        <div class="card-body d-flex flex-column" style="height: 100%;">

                            <form class="row g-3 needs-validation flex-grow-1" novalidate method="POST" th:action="@{/autoavaliacao/criar-pergunta}">

                                <div class="my-3">
                                    <label for="descricao" class="form-label">Cadastrar enunciado:</label>
                                    <textarea class="form-control" style="height: 250px" name="descricao" id="descricao" rows="3" required></textarea>
                                </div>

                                <input type="hidden" name="tipo" value="Objetiva">

                                <div class="my-3">
                                    <div class="container-perguntas1">
                                        <div class="form-check form-check-inline">
                                            <input class="form-check-input readonly-field" type="radio" name="likert" id="likert1" value="Discordo Totalmente" readonly>
                                            <label class="form-check-label" for="likert1">Discordo Totalmente</label>
                                        </div>
                                        <div class="form-check form-check-inline">
                                            <input class="form-check-input readonly-field" type="radio" name="likert" id="likert2" value="Discordo" readonly>
                                            <label class="form-check-label" for="likert2">Discordo</label>
                                        </div>
                                        <div class="form-check form-check-inline">
                                            <input class="form-check-input readonly-field" type="radio" name="likert" id="likert3" value="Neutro" readonly>
                                            <label class="form-check-label" for="likert3">Neutro</label>
                                        </div>
                                        <div class="form-check form-check-inline">
                                            <input class="form-check-input readonly-field" type="radio" name="likert" id="likert4" value="Concordo" readonly>
                                            <label class="form-check-label" for="likert4">Concordo</label>
                                        </div>
                                        <div class="form-check form-check-inline">
                                            <input class="form-check-input readonly-field" type="radio" name="likert" id="likert5" value="Concordo Totalmente" readonly>
                                            <label class="form-check-label" for="likert5">Concordo Totalmente</label>
                                        </div>
                                    </div>
                                </div>

                                <div class="text-end my-3">
                                    <button class="btn btn-primary btn-lg me-4" data-bs-toggle="modal" data-bs-target="#disablebackdrop" style="width: 200px; height: 50px;">
                                        Cadastrar
                                    </button>
                                </div>

                            </form>
                        </div>
                    </div>
                </div>

                <div class="col-lg-6">
                    <h2 class="title-tipo-pergunta">Pergunta Subjetiva:</h2>

                    <div class="card-pergunta" style="height: 650px">
                        <div class="card-body d-flex flex-column" style="height: 100%;">

                            <form class="row g-3 needs-validation flex-grow-1" novalidate method="POST" th:action="@{/autoavaliacao/criar-pergunta}">

                                <div class="my-3">
                                    <label for="descricao" class="form-label">Cadastrar enunciado:</label>
                                    <textarea class="form-control" style="height: 250px" name="descricao" id="descricao" rows="3" required></textarea>
                                </div>

                                <input type="hidden" name="tipo" value="Subjetiva">

                                <div class="my-3">
                                    <label for="resposta" class="form-label">(Campo de resposta)</label>
                                    <textarea class="form-control readonly-field" style="height: 148px" id="resposta" rows="3" readonly></textarea>
                                </div>

                                <div class="text-end my-3">
                                    <button class="btn btn-primary btn-lg me-4" data-bs-toggle="modal" data-bs-target="#disablebackdrop" style="width: 200px; height: 50px;">
                                        Cadastrar
                                    </button>
                                </div>

                            </form>

                            <div class="modal fade" id="disablebackdrop" tabindex="-1" data-bs-backdrop="false">
                                <div class="modal-dialog">
                                    <div class="modal-content">
                                        <div class="modal-header">
                                            <h5 class="modal-title">Cadastro de Perguntas</h5>
                                            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                                        </div>
                                        <div class="modal-body">
                                            Pergunta cadastrada com sucesso!
                                        </div>
                                        <div class="modal-footer">
                                            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Voltar</button>
                                        </div>
                                    </div>
                                </div>
                            </div>

                        </div>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <a href="#" class="back-to-top d-flex align-items-center justify-content-center"><i class="bi bi-arrow-up-short"></i></a>

    <script src="/assets/vendor/apexcharts/apexcharts.min.js"></script>
    <script src="/assets/vendor/bootstrap/js/bootstrap.bundle.min.js"></script>
    <script src="/assets/vendor/chart.js/chart.umd.js"></script>
    <script src="/assets/vendor/echarts/echarts.min.js"></script>
    <script src="/assets/vendor/quill/quill.js"></script>
    <script src="/assets/vendor/simple-datatables/simple-datatables.js"></script>
    <script src="/assets/vendor/tinymce/tinymce.min.js"></script>
    <script src="/assets/vendor/php-email-form/validate.js"></script>

    <script src="/assets/js/main.js"></script>

</div>

</body>
</html>
