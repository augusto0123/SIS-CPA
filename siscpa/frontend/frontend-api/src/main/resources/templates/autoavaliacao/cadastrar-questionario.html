<!DOCTYPE html>
<html layout:decorate="~{layout}">
<head>
    <meta charset="UTF-8">
    <title>Questionário</title>
</head>
<body>

<div layout:fragment="body">

    <main id="main" class="main">

        <div class="pagetitle">
            <h1>Cadastrar Questionário</h1>
            <nav>
                <ol class="breadcrumb">
                    <li class="breadcrumb-item"><a href="index-membroCPA.html">Incio</a></li>
                    <li class="breadcrumb-item">Avaliação</li>
                    <li class="breadcrumb-item active">Questionário</li>
                </ol>
            </nav>
        </div>

        <section class="section">
            <div class="row">

                <div class="col-lg-6">

                    <h5 class="card-title-questionario-cadastrar">Questionários</h5>

                    <div class="card-questionario">

                        <div class="card-body">


                            <form class="row g-3 needs-validation" novalidate method="POST" th:action="@{/autoavaliacao/criar-questionario}">

                                <div class="row mb-3">
                                    <label for="categoria" class="col-md-3 col-form-label">Questionário do(a)</label>
                                    <div class="col-md-9">
                                        <select class="form-select" aria-label="Default select example" name="categoria" id="categoria" required>
                                            <option selected="Aluno">Aluno</option>
                                            <option value="Professor">Professor</option>
                                            <option value="Colaborador">Colaborador</option>
                                            <option value="Comunidade Externa">Comunidade Externa</option>
                                        </select>
                                    </div>
                                </div>

                                <div class="row mb-3">
                                    <label for="descricao" class="col-md-3 col-form-label">Descrição do Questionário</label>
                                    <div class="col-md-9">
                                        <textarea class="form-control" style="height: 100px" required placeholder="Digite aqui..." name="descricao" id="descricao"></textarea>
                                    </div>
                                </div>

                                <div class="text-center mb-3">
                                    <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#disablebackdrop" style="width: auto;">
                                        Cadastrar
                                    </button>
                                </div>

                                <div class="modal fade" id="disablebackdrop" tabindex="-1" data-bs-backdrop="false">
                                    <div class="modal-dialog">
                                        <div class="modal-content">
                                            <div class="modal-header">
                                                <h5 class="modal-title">Reunião CPA</h5>
                                                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                                            </div>
                                            <div class="modal-body">
                                                Sua reunião foi enviada com sucesso!
                                            </div>
                                            <div class="modal-footer">
                                                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Voltar</button>
                                            </div>
                                        </div>
                                    </div>
                                </div>

                            </form>

                        </div>
                    </div>

                </div>
            </div>
        </section>
</main>

<a href="#" class="back-to-top d-flex align-items-center justify-content-center"><i class="bi bi-arrow-up-short"></i></a>

<script src="/assets/vendor/apexcharts/apexcharts.min.js"></script>
<script src="/assets/vendor/bootstrap/js/bootstrap.bundle.min.js"></script>
<script src="/assets/vendor/chart.js/chart.umd.js"></script>
<script src="/assets/vendor/echarts/echarts.min.js"></script>
<script src="/assets/vendor/quill/quill.js"></script>
<script src="/assets/vendor/simple-datatables/simple-datatables.js"></script>
<script src="/assets/vendor/tinymce/tinymce.min.js"></script>
<script src="/assets/vendor/php-email-form/validate.js"></script>

<script src="/assets/js/main.js"></script>

</div>

</body>
</html>
