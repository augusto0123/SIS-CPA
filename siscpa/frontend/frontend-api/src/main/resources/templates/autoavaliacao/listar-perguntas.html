<!DOCTYPE html>
<html layout:decorate="~{layout}">
<head>
    <meta charset="UTF-8">
    <title>Listar Perguntas</title>
</head>
<body class="body-pergunta">

<div layout:fragment="body">

    <main id="main" class="main">

    <div class="pagetitle">
        <h1>Listar Perguntas</h1>
        <nav>
            <ol class="breadcrumb">
                <li class="breadcrumb-item"><a href="index-membroCPA.html">Incio</a></li>
                <li class="breadcrumb-item">Avaliação</li>
                <li class="breadcrumb-item active">Lista de Perguntas</li>
            </ol>
        </nav>
    </div>

    <section class="section-pergunta">
        <div class="row">

            <div class="col-lg-5 col-sm-12 mb-4 mx-4" th:each="pergunta : ${perguntas}">

                <div th:if="${pergunta.tipo == 'Objetiva'}">

                    <h2 class="title-tipo-pergunta">Pergunta Objetiva:</h2>

                    <div class="card-resposta">

                        <div class="card-body-responder">

                            <form class="row g-3 needs-validation" novalidate>
                                <div class="mb-3">
                                    <span class="form-label-span" th:text="${pergunta.descricao}"></span>
                                </div>

                                <div class="mb-3">
                                    <div>
                                        <div class="form-check">
                                            <input class="form-check-input" type="radio" name="likert" id="likert1" value="Discordo Totalmente" required>
                                            <label class="form-check-label" for="likert1">Discordo Totalmente</label>
                                        </div>
                                        <div class="form-check">
                                            <input class="form-check-input" type="radio" name="likert" id="likert2" value="Discordo" required>
                                            <label class="form-check-label" for="likert2">Discordo</label>
                                        </div>
                                        <div class="form-check">
                                            <input class="form-check-input" type="radio" name="likert" id="likert3" value="Neutro" required>
                                            <label class="form-check-label" for="likert3">Neutro</label>
                                        </div>
                                        <div class="form-check">
                                            <input class="form-check-input" type="radio" name="likert" id="likert4" value="Concordo" required>
                                            <label class="form-check-label" for="likert4">Concordo</label>
                                        </div>
                                        <div class="form-check">
                                            <input class="form-check-input" type="radio" name="likert" id="likert5" value="Concordo Totalmente" required>
                                            <label class="form-check-label" for="likert5">Concordo Totalmente</label>
                                        </div>
                                    </div>
                                </div>
                            </form>
                        </div>
                    </div>
                </div>

                <div th:if="${pergunta.tipo == 'Subjetiva'}">

                    <h2 class="title-tipo-pergunta">Pergunta Subjetiva:</h2>

                    <div class="card-resposta">

                        <div class="card-body-responder">
                            <form class="row g-3 needs-validation" novalidate>

                                <div class="mb-3">
                                    <label for="resposta" class="form-label-span" th:text="${pergunta.descricao}"></label>
                                </div>
                                <textarea class="form-control" id="resposta" rows="3" placeholder="Responda aqui..."></textarea>
                            </form>
                        </div>
                    </div>
                </div>
            </div>

<!--            <div class="col-lg-11">-->

        </div>
    </section>
    </main>

    <a href="#" class="back-to-top d-flex align-items-center justify-content-center"><i class="bi bi-arrow-up-short"></i></a>

    <script src="/assets/vendor/apexcharts/apexcharts.min.js"></script>
    <script src="/assets/vendor/bootstrap/js/bootstrap.bundle.min.js"></script>
    <script src="/assets/vendor/chart.js/chart.umd.js"></script>
    <script src="/assets/vendor/echarts/echarts.min.js"></script>
    <script src="/assets/vendor/quill/quill.js"></script>
    <script src="/assets/vendor/simple-datatables/simple-datatables.js"></script>
    <script src="/assets/vendor/tinymce/tinymce.min.js"></script>
    <script src="/assets/vendor/php-email-form/validate.js"></script>

    <script src="/assets/js/main.js"></script>

</div>

</body>
</html>
