<!DOCTYPE html>
<html layout:decorate="~{layout}">
<head>
    <meta charset="UTF-8">
    <title>Vincular-se como Usuário</title>
    <!-- Icones -->
    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
          integrity="sha512-SnH5WK+bZxgPHs44uWIX+LLJAJ9/2PkPKZ5QiAj6Ta86w+fsb2TkcmfRyVX3pBnMFcV7oQPJkl9QevSCWr3W6A=="
          crossorigin="anonymous"
          referrerpolicy="no-referrer" />

    <link href="/assets/css/style.css" rel="stylesheet">
</head>
<body>

<div layout:fragment="body">

    <main id="main" class="main">

        <div class="pagetitle">
            <h1>Associar-se a um papel</h1>
            <nav>
                <ol class="breadcrumb">
                    <li class="breadcrumb-item"><a href="index-admin.html">Vincular Instituição</a></li>
                    <li class="breadcrumb-item active">Associar Papel</li>
                </ol>
            </nav>
        </div>

        <section class="section">

            <div class="row">

                <div class="col-lg-3">

                    <div class="card-membro">

                        <div class="card-body">

                            <form class="row g-3 needs-validation" method="POST" th:action="@{/conta/vincular-usuario}">

                                <div class="card-body-membro">


                                    <div class="col-12">
                                        <input type="hidden" name="instituicaoId" class="form-control" id="instituicaoId" th:value="${instituicaoId}">
                                    </div>

                                    <i class="fa-solid fa-user"></i>

                                    <h5 class="card-title">Selecione seu papel na Instituição:</h5>

                                    <select class="form-select-membro" aria-label="Default select example" name="tipo" id="tipo" required>
                                        <option selected value="Aluno">Aluno</option>
                                        <option value="Professor">Professor</option>
                                        <option value="Colaborador">Colaborador</option>
                                        <option value="Comunidade Externa">Comunidade Externa</option>
                                    </select>
                                </div>

                                <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#basicModal">
                                    Associar
                                </button>

                                <div class="modal fade" id="basicModal" tabindex="-1">
                                    <div class="modal-dialog">
                                        <div class="modal-content">
                                            <div class="modal-header">
                                                <h5 class="modal-title">Papel associado! Deseja entrar na Instituição?</h5>
                                                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                                            </div>

                                            <div class="modal-footer">
                                                <a th:href="@{/instituicao/inicio}" class="btn btn-primary">Entrar</a>
                                                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Voltar</button>
                                            </div>
                                        </div>
                                    </div>
                                </div>

                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <a href="#" class="back-to-top d-flex align-items-center justify-content-center"><i class="bi bi-arrow-up-short"></i></a>

    <script src="/assets/vendor/apexcharts/apexcharts.min.js"></script>
    <script src="/assets/vendor/bootstrap/js/bootstrap.bundle.min.js"></script>
    <script src="/assets/vendor/chart.js/chart.umd.js"></script>
    <script src="/assets/vendor/echarts/echarts.min.js"></script>
    <script src="/assets/vendor/quill/quill.js"></script>
    <script src="/assets/vendor/simple-datatables/simple-datatables.js"></script>
    <script src="/assets/vendor/tinymce/tinymce.min.js"></script>
    <script src="/assets/vendor/php-email-form/validate.js"></script>

    <!-- Template Main JS File -->
    <script src="/assets/js/main.js"></script>

</div>

</body>
</html>
