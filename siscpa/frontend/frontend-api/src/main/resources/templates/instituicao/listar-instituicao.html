<!DOCTYPE html>
<html layout:decorate="~{layout}">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
</head>
<body>

<div layout:fragment="body">

    <main id="main" class="main">

        <div class="pagetitle">
            <h1>Listar Instituição</h1>
            <nav>
                <ol class="breadcrumb">
                    <li class="breadcrumb-item"><a href="index.html">Inicio</a></li>
                    <li class="breadcrumb-item">Instituição</li>
                    <li class="breadcrumb-item active">Listar Instituição</li>
                </ol>
            </nav>
        </div><!-- End Page Title -->

        <section class="section">
            <div class="row">

                <div class="col-lg-12">

                    <div class="row justify-content-center">
                        <div class="card mb-5">
                            <div class="card-body">
                                <table class="table table-striped table-hover text-center">
                                    <thead>
                                    <tr>
                                        <th scope="col">CNPJ</th>
                                        <th scope="col">Email</th>
                                        <th scope="col">razao_social</th>
                                        <th scope="col">nome_fantasia</th>
                                        <th scope="col">telefone</th>
                                        <th scope="col">email_responsavel</th>
                                        <th scope="col">telefone_responsavel</th>
                                        <th scope="col">nome_responsavel</th>
                                        <th scope="col">situacao</th>
                                        <th scope="col">Logradouro</th>
                                        <th scope="col">numero</th>
                                        <th scope="col">bairro</th>
                                        <th scope="col">cep</th>
                                        <th scope="col">complemento</th>
                                    </tr>
                                    </thead>
                                    <tbody>
                                    <tr th:each="instituicao : ${instituicoes}">
                                        <th scope="row" th:text="${instituicao.cnpj}"></th>
                                        <td th:text="${instituicao.email}"></td>
                                        <td th:text="${instituicao.razaoSocial}"></td>
                                        <td th:text="${instituicao.nomeFantasia}"></td>
                                        <td th:text="${instituicao.telefone}"></td>
                                        <td th:text="${instituicao.resposavelEmail}"></td>
                                        <td th:text="${instituicao.responsavelTelefone}"></td>
                                        <td th:text="${instituicao.responsavelNome}"></td>
                                        <td th:text="${instituicao.situacao}"></td>

                                        <td th:text="${instituicao.endereco.logradouro}"></td>
                                        <td th:text="${instituicao.endereco.numero}"></td>
                                        <td th:text="${instituicao.endereco.bairro}"></td>
                                        <td th:text="${instituicao.endereco.cep}"></td>
                                        <td th:text="${instituicao.endereco.complemento}"></td>

                                    </tr>
                                    </tbody>
                                </table>
                            </div>
                        </div>
                    </div>

            </div>
        </section>

    </main><!-- End #main -->


</div>

</body>
</html>
