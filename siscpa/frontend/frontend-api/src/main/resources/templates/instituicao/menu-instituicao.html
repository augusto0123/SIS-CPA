<!DOCTYPE html>
<html layout:decorate="~{layout}">
<head>
    <meta charset="UTF-8">
    <title>Menu Instituição</title>
    <!-- Icones -->
    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
          integrity="sha512-SnH5WK+bZxgPHs44uWIX+LLJAJ9/2PkPKZ5QiAj6Ta86w+fsb2TkcmfRyVX3pBnMFcV7oQPJkl9QevSCWr3W6A=="
          crossorigin="anonymous"
          referrerpolicy="no-referrer" />

    <link href="/assets/css/style.css" rel="stylesheet">
</head>
<body>

<div layout:fragment="body">

    <main id="main" class="main">

        <div class="pagetitle">
            <h1>Menu da Instituição</h1>
            <nav>
                <ol class="breadcrumb">
                    <li class="breadcrumb-item"><a href="index-admin.html">Inicio</a></li>
                    <li class="breadcrumb-item">Listar Instituições</li>
                    <li class="breadcrumb-item active">Menu</li>
                </ol>
            </nav>
        </div>

        <section class="section-menu-instituicao">
            <div class="row">

                <div class="col-lg-3">

                    <div class="card-instituicao">

                        <div class="card-body">

                            <form class="row g-3 needs-validation" novalidate>

                                <div class="card-body-membro">
                                    <i class="fa-solid fa-user-plus"></i>
                                    <h5 class="card-title">Cadastrar Membro</h5>
                                </div>

                                <a class="btn btn-primary" th:href="@{/instituicao/adicionar-membro/{id}(id=${instituicaoId})}">
                                    Visualizar
                                </a>
                            </form>
                        </div>
                    </div>

                </div>

                <div class="col-lg-3">

                    <div class="card-instituicao">

                        <div class="card-body">

                            <form class="row g-3 needs-validation" novalidate>

                                <div class="card-body-membro">

                                    <i class="fa-solid fa-people-group"></i>

                                    <h5 class="card-title">Listar Membros</h5>

                                </div>

                                <a class="btn btn-primary" th:href="@{/instituicao/listar-membro/{id}(id=${instituicaoId})}">
                                    Visualizar
                                </a>

                            </form>
                        </div>
                    </div>

                </div>

                <div class="col-lg-3">

                    <div class="card-instituicao">

                        <div class="card-body">

                            <form class="row g-3 needs-validation" novalidate>

                                <div class="card-body-membro">

                                    <i class="fa-solid fa-user"></i>

                                    <h5 class="card-title">Listar Usuários</h5>

                                </div>

                                <a class="btn btn-primary" th:href="@{/instituicao/listar-usuarios/{id}(id=${instituicaoId})}">
                                    Visualizar
                                </a>

                            </form>
                        </div>
                    </div>

                </div>
            </div>
        </section>
    </main>

    <a href="#" class="back-to-top d-flex align-items-center justify-content-center"><i class="bi bi-arrow-up-short"></i></a>

    <script src="/assets/vendor/apexcharts/apexcharts.min.js"></script>
    <script src="/assets/vendor/bootstrap/js/bootstrap.bundle.min.js"></script>
    <script src="/assets/vendor/chart.js/chart.umd.js"></script>
    <script src="/assets/vendor/echarts/echarts.min.js"></script>
    <script src="/assets/vendor/quill/quill.js"></script>
    <script src="/assets/vendor/simple-datatables/simple-datatables.js"></script>
    <script src="/assets/vendor/tinymce/tinymce.min.js"></script>
    <script src="/assets/vendor/php-email-form/validate.js"></script>

    <!-- Template Main JS File -->
    <script src="/assets/js/main.js"></script>


</div>

</body>
</html>
