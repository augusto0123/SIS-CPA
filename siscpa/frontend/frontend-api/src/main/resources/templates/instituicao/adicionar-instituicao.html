<!DOCTYPE html>
<html layout:decorate="~{layout}">
<head>
    <meta charset="UTF-8">
    <title>Cadastrar Instituição</title>
</head>
<body>

<div layout:fragment="body">

    <main id="main" class="main">

        <div class="pagetitle">
            <h1>Cadastrar Instituição</h1>
            <nav>
                <ol class="breadcrumb">
                    <li class="breadcrumb-item"><a href="index.html">Incio</a></li>
                    <li class="breadcrumb-item">Instituição</li>
                    <li class="breadcrumb-item active">Cadastrar Instituição</li>
                </ol>
            </nav>
        </div>

        <section class="section">
            <div class="row">
                <div class="col-lg-12">

                    <form class="row g-3 needs-validation" novalidate method="POST" th:action="@{/instituicao/criar-instituicao}" th:object="${instituicao}">

                        <div class="card">

                            <div class="card-body">

                                    <div class="pb-2">
                                        <h5 class="card-title-cadastrar-instituicao">Dados da Instituição</h5>
                                    </div>

                                    <div class="row my-4">
                                        <label for="nomeFantasia" class="col-sm-2 col-form-label">Nome Fantasia</label>
                                        <div class="col-sm-10">
                                            <input type="text" name="nomeFantasia" class="form-control" id="nomeFantasia" required>
                                        </div>
                                    </div>

                                    <div class="row mb-4">
                                        <label for="razaoSocial" class="col-sm-2 col-form-label">Razão Social</label>
                                        <div class="col-sm-10">
                                            <input type="text" name="razaoSocial" class="form-control" id="razaoSocial" required>
                                        </div>
                                    </div>

                                    <div class="row my-4">
                                        <label for="email" class="col-sm-2 col-form-label">Email</label>
                                        <div class="col-sm-10">
                                            <input type="email" name="email" class="form-control" id="email" required>
                                        </div>
                                    </div>

                                    <div class="row my-4">
                                        <label for="cnpj" class="col-sm-2 col-form-label">CNPJ</label>
                                        <div class="col-sm-10">
                                            <input type="text" name="cnpj" class="form-control" id="cnpj" required>
                                        </div>
                                    </div>

                                    <div class="row my-4">
                                        <label for="telefone" class="col-sm-2 col-form-label">Telefone</label>
                                        <div class="col-sm-10">
                                            <input type="text" name="telefone" class="form-control" id="telefone" required>
                                        </div>
                                    </div>

                                    <div class="row my-4">
                                        <label for="situacao" class="col-sm-2 col-form-label">Situação</label>
                                        <div class="col-sm-10">
                                            <input type="text" name="situacao" class="form-control" id="situacao" required>
                                        </div>
                                    </div>
                            </div>
                        </div>

                        <div class="card">
                            <div class="card-body">
                                <div class="pb-2">
                                    <h5 class="card-title-cadastrar-instituicao">Endereço da Instituição</h5>
                                </div>

                                <div class="row my-4">
                                    <label for="logradouro" class="col-sm-2 col-form-label">Logradouro</label>
                                    <div class="col-sm-10">
                                        <input type="text" name="logradouro" class="form-control" id="logradouro" required th:field="${instituicao.endereco.logradouro}">
                                    </div>
                                </div>

                                <div class="row my-4">
                                    <label for="numero" class="col-sm-2 col-form-label">Número</label>
                                    <div class="col-sm-10">
                                        <input type="text" name="numero" class="form-control" id="numero" required th:field="${instituicao.endereco.numero}">
                                    </div>
                                </div>

                                <div class="row my-4">
                                    <label for="bairro" class="col-sm-2 col-form-label">Bairro</label>
                                    <div class="col-sm-10">
                                        <input type="text" name="bairro" class="form-control" id="bairro" required th:field="${instituicao.endereco.bairro}">
                                    </div>
                                </div>

                                <div class="row my-4">
                                    <label for="cidade" class="col-sm-2 col-form-label">Cidade</label>
                                    <div class="col-sm-10">
                                        <input type="text" name="cidade" class="form-control" id="cidade" required th:field="${instituicao.endereco.cidade}">
                                    </div>
                                </div>

                                <div class="row my-4">
                                    <label for="complemento" class="col-sm-2 col-form-label">Complemento</label>
                                    <div class="col-sm-10">
                                        <input type="text" name="complemento" class="form-control" id="complemento" th:field="${instituicao.endereco.complemento}" placeholder="(Opcional)">
                                    </div>
                                </div>
                            </div>
                        </div>

                        <div class="card">
                            <div class="card-body">
                                <div class="pb-2">
                                    <h5 class="card-title-cadastrar-instituicao">Dados do Responsável</h5>
                                </div>

                                <div class="row my-4">
                                    <label for="responsavelNome" class="col-sm-2 col-form-label">Nome</label>
                                    <div class="col-sm-10">
                                        <input type="text" name="responsavelNome" class="form-control" id="responsavelNome" required>
                                    </div>
                                </div>

                                <div class="row my-4">
                                    <label for="responsavelTelefone" class="col-sm-2 col-form-label">Telefone</label>
                                    <div class="col-sm-10">
                                        <input type="text" name="responsavelTelefone" class="form-control" id="responsavelTelefone" required>
                                    </div>
                                </div>

                                <div class="row my-4">
                                    <label for="responsavelEmail" class="col-sm-2 col-form-label">Email</label>
                                    <div class="col-sm-10">
                                        <input type="email" name="responsavelEmail" class="form-control" id="responsavelEmail" required>
                                    </div>
                                </div>
                            </div>
                        </div>

                                    <div class="text-center my-4">
                                        <button class="btn btn-primary btn-lg w-20" data-bs-toggle="modal" data-bs-target="#disablebackdrop">
                                            Cadastrar
                                        </button>
                                    </div>


                                    <div class="modal fade" id="disablebackdrop" tabindex="-1" data-bs-backdrop="false">
                                        <div class="modal-dialog">
                                            <div class="modal-content">
                                                <div class="modal-header">
                                                    <h5 class="modal-title">Cadastro de Instituição</h5>
                                                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                                                </div>

                                                <div class="modal-body">
                                                    Seu cadastro foi realizado com sucesso!
                                                </div>

                                                <div class="modal-footer">
                                                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Voltar</button>
                                                </div>
                                            </div>
                                        </div>
                                    </div>
                    </form>
                </div>
            </div>
        </section>
    </main>

    <a href="#" class="back-to-top d-flex align-items-center justify-content-center"><i class="bi bi-arrow-up-short"></i></a>

</div>

</body>
</html>
