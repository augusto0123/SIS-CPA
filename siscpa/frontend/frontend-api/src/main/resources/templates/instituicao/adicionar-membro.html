<!DOCTYPE html>
<html layout:decorate="~{layout}">
<head>
    <meta charset="UTF-8">
    <title>Cadastrar Membro da CPA</title>

    <!-- Icones -->
    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
          integrity="sha512-SnH5WK+bZxgPHs44uWIX+LLJAJ9/2PkPKZ5QiAj6Ta86w+fsb2TkcmfRyVX3pBnMFcV7oQPJkl9QevSCWr3W6A=="
          crossorigin="anonymous"
          referrerpolicy="no-referrer" />

    <link href="/assets/css/style.css" rel="stylesheet">
</head>
<body>

    <div layout:fragment="body">

        <main id="main" class="main">

            <div class="pagetitle">
                <h1>Cadastrar Membro CPA</h1>
                <nav>
                    <ol class="breadcrumb">
                        <li class="breadcrumb-item"><a href="index-admin.html">Incio</a></li>
                        <li class="breadcrumb-item">Instituição</li>
                        <li class="breadcrumb-item active">Cadastrar Membro CPA</li>
                    </ol>
                </nav>
            </div>

            <div class="search-bar">
                <form class="search-form d-flex align-items-center" method="POST" action="#">
                    <input type="text" name="query" placeholder="Pesquisar" title="Enter search keyword">
                    <button type="submit" title="Search" class="search-membro"><i class="bi bi-search"></i></button>
                </form>
            </div>

            <section class="section">
                <div class="row">

                    <div class="col-lg-3">

                        <div class="card-membro">

                            <div class="card-body">

                                <form class="row g-3 needs-validation" novalidate>

                                        <div class="card-body-membro">

                                            <i class="fa-solid fa-user-tie"></i>

                                            <h5 class="card-title">Nome</h5>
                                            <label class="email-membro">Email</label>

                                            <p>Alterar tipo de usuário:</p>

                                            <select class="form-select-membro" aria-label="Default select example" required>
                                                <option selected></option>
                                                <option value="1">Aluno</option>
                                                <option value="2">Professor</option>
                                                <option value="3">Colaborador</option>
                                                <option value="4">Comunidade Externa</option>
                                                <option value="4">Membro CPA</option>
                                            </select>
                                        </div>

                                    <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#disablebackdrop">
                                        Cadastrar
                                    </button>

                                        <div class="modal fade" id="disablebackdrop" tabindex="-1" data-bs-backdrop="false">
                                            <div class="modal-dialog">
                                                <div class="modal-content">
                                                    <div class="modal-header">
                                                        <h5 class="modal-title">Cadastro de Membros</h5>
                                                        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                                                    </div>
                                                    <div class="modal-body">
                                                       Membro cadastrado com sucesso!
                                                    </div>
                                                    <div class="modal-footer">
                                                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Voltar</button>
                                                    </div>
                                                </div>
                                            </div>
                                        </div>
                                </form>
                            </div>
                        </div>

                    </div>

                </div>
            </section>
        </main>

        <a href="#" class="back-to-top d-flex align-items-center justify-content-center"><i class="bi bi-arrow-up-short"></i></a>

        <script src="/assets/vendor/apexcharts/apexcharts.min.js"></script>
        <script src="/assets/vendor/bootstrap/js/bootstrap.bundle.min.js"></script>
        <script src="/assets/vendor/chart.js/chart.umd.js"></script>
        <script src="/assets/vendor/echarts/echarts.min.js"></script>
        <script src="/assets/vendor/quill/quill.js"></script>
        <script src="/assets/vendor/simple-datatables/simple-datatables.js"></script>
        <script src="/assets/vendor/tinymce/tinymce.min.js"></script>
        <script src="/assets/vendor/php-email-form/validate.js"></script>

        <!-- Template Main JS File -->
        <script src="/assets/js/main.js"></script>

    </div>

</body>
</html>
