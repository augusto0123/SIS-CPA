<!DOCTYPE html>
<html layout:decorate="~{layout}">
<head>
    <meta charset="UTF-8">
    <title>Cadastrar Membro CPA</title>
    <!-- Icones -->
    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
          integrity="sha512-SnH5WK+bZxgPHs44uWIX+LLJAJ9/2PkPKZ5QiAj6Ta86w+fsb2TkcmfRyVX3pBnMFcV7oQPJkl9QevSCWr3W6A=="
          crossorigin="anonymous"
          referrerpolicy="no-referrer" />

    <link href="/assets/css/style.css" rel="stylesheet">
</head>
<body>

<div layout:fragment="body">

    <main id="main" class="main">

        <div class="pagetitle">
            <h1>Cadastrar Membro CPA</h1>
            <nav>
                <ol class="breadcrumb">
                    <li class="breadcrumb-item"><a href="index-admin.html">Inicio</a></li>
                    <li class="breadcrumb-item">Instituição</li>
                    <li class="breadcrumb-item active">Listar Usuarios</li>
                </ol>
            </nav>
        </div>

<!--        <div class="search-bar">-->
<!--            <form class="search-form d-flex align-items-center" method="POST" action="#">-->
<!--                <input type="text" name="query" placeholder="Pesquisar" title="Enter search keyword">-->
<!--                <button type="submit" title="Search" class="search-membro"><i class="bi bi-search"></i></button>-->
<!--            </form>-->
<!--        </div>-->

        <section class="section">
            <div class="row">

                <div class="col-lg-3" th:each="usuarioA, iterStat : ${usuarios}">

                    <div class="card-membro">
                        <div class="card-body">

                                <form class="row g-3 needs-validation" novalidate method="POST" th:action="@{/conta/update}">

                                <div class="card-body-membro">

                                    <i class="fa-solid fa-user"></i>

                                    <h5 class="card-title" th:text="${usuarioA.nome}"></h5>

                                    <!--                                    <input type="hidden" name="id" id="id" th:field="${usuario.id}">-->

                                    <input type="hidden" name="id" id="id" th:value="${usuarioA.id}">

                                    <input type="hidden" name="nome" id="nome" th:value="${usuarioA.nome}">

                                    <input type="hidden" name="email" id="email" th:value="${usuarioA.email}">

                                    <input type="hidden" name="senha" id="senha" th:value="${usuarioA.senha}">

                                    <!--                                    <input type="hidden" name="instituicaoId" id="instituicaoId" th:text="${usuario.instituicaoId}" th:value="${usuario.instituicaoId}">-->
                                    <!--                                    <input type="hidden" name="id" id="id">-->

                                    <!--                                    <input type="hidden" name="nome" id="nome">-->

                                    <!--                                    <input type="hidden" name="email" id="email">-->

                                    <!--                                    <input type="hidden" name="senha" id="senha">-->

                                    <!--                                    <input type="hidden" name="telefone" id="telefone">-->

                                    <!--                                    <input type="hidden" name="instituicaoId" id="instituicaoId">-->

<!--                                    iiiiiiiiiiiiii-->

<!--                                    <input type="hidden" name="id" id="id">-->

<!--                                    <input type="hidden" name="nome" id="nome">-->

<!--                                    <input type="hidden" name="email" id="email">-->

<!--                                    <input type="hidden" name="senha" id="senha">-->

<!--                                    <input type="hidden" name="telefone" id="telefone">-->

<!--                                    <input type="hidden" name="instituicaoId" id="instituicaoId">-->


                                    <select class="form-select" aria-label="Default select example" name="tipo" id="tipo">
                                        <option value="Aluno" th:selected="${usuarioA.tipo == 'Aluno'}">Aluno</option>
                                        <option value="Professor" th:selected="${usuarioA.tipo == 'Professor'}">Professor</option>
                                        <option value="Colaborador" th:selected="${usuarioA.tipo == 'Colaborador'}">Colaborador</option>
                                        <option value="Comunidade Externa" th:selected="${usuarioA.tipo == 'Comunidade Externa'}">Comunidade Externa</option>
                                        <option value="Membro CPA" th:selected="${usuarioA.tipo == 'Membro CPA'}">Membro CPA</option>
                                    </select>
                                </div>

<!--                                <div class="input-group">-->
<!--                                    <input type="hidden" name="id" id="id" th:field="${usuario.id}">-->
<!--                                </div>-->

                                <button class="btn btn-primary">
                                    Salvar
                                </button>

                            </form>

                        </div>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <a href="#" class="back-to-top d-flex align-items-center justify-content-center"><i class="bi bi-arrow-up-short"></i></a>

    <script src="/assets/vendor/apexcharts/apexcharts.min.js"></script>
    <script src="/assets/vendor/bootstrap/js/bootstrap.bundle.min.js"></script>
    <script src="/assets/vendor/chart.js/chart.umd.js"></script>
    <script src="/assets/vendor/echarts/echarts.min.js"></script>
    <script src="/assets/vendor/quill/quill.js"></script>
    <script src="/assets/vendor/simple-datatables/simple-datatables.js"></script>
    <script src="/assets/vendor/tinymce/tinymce.min.js"></script>
    <script src="/assets/vendor/php-email-form/validate.js"></script>

    <!-- Template Main JS File -->
    <script src="/assets/js/main.js"></script>

</div>

</body>
</html>
